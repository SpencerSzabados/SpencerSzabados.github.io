<header>
  <span class="name"><a href="{{ "/" | relURL }}">{{ site.Title }}</a></span>
  <nav>
    {{- range site.Menus.main }}
    {{- $active := or (eq $.RelPermalink .URL) (and (ne .URL "/") (hasPrefix $.RelPermalink .URL)) }}
    <a href="{{ .URL | relURL }}"{{ if $active }} class="active"{{ end }}>{{ .Name }}</a>
    {{- end }}
  </nav>
</header>
